# DigitalOcean Functions project — GitHub OAuth proxy for Decap CMS.
# Deploy:  doctl serverless deploy functions   (from the repo root)
# Values for environment variables come from functions/.env (never committed — see
# functions/.env.example).
packages:
  - name: auth
    functions:
      - name: oauth
        runtime: nodejs:18
        web: true
        parameters:
          GITHUB_CLIENT_ID: '${GITHUB_CLIENT_ID}'
          GITHUB_CLIENT_SECRET: '${GITHUB_CLIENT_SECRET}'
          ALLOWED_DOMAINS: '${ALLOWED_DOMAINS}'
        environment:
          GITHUB_CLIENT_ID: '${GITHUB_CLIENT_ID}'
          GITHUB_CLIENT_SECRET: '${GITHUB_CLIENT_SECRET}'
          ALLOWED_DOMAINS: '${ALLOWED_DOMAINS}'
