# DigitalOcean App Platform spec — PRODUCTION
# Deploys the static site from the `main` branch.
#
# Usage: doctl apps create --spec .do/app.yaml
# (or paste into the App Platform dashboard "App Spec" editor).
#
# Set real env-var values in the DO dashboard (or via `doctl apps update`);
# the empty values below only declare the keys. All are BUILD_TIME because
# Astro inlines import.meta.env.PUBLIC_* at build.
#
# Custom domain (resultsmatrix.com) is added at DNS cutover — see the
# README cutover checklist. Do not attach the domain before acceptance.

name: rml-website
region: nyc

static_sites:
  - name: site
    github:
      repo: resultsmatrixtools/rml-website
      branch: main
      deploy_on_push: true
    build_command: npm ci && npm run build
    output_dir: dist
    environment_slug: node-js
    error_document: 404.html
    envs:
      - key: PUBLIC_HUBSPOT_PORTAL_ID
        scope: BUILD_TIME
        value: ""
      - key: PUBLIC_HUBSPOT_FORM_GUID_CONTACT
        scope: BUILD_TIME
        value: ""
      - key: PUBLIC_HUBSPOT_FORM_GUID_RESOURCE
        scope: BUILD_TIME
        value: ""
      - key: PUBLIC_HUBSPOT_FORM_GUID_CONSULT
        scope: BUILD_TIME
        value: ""
      - key: PUBLIC_CONSULTATION_PAYMENT_URL
        scope: BUILD_TIME
        value: ""
      - key: PUBLIC_SITE_URL
        scope: BUILD_TIME
        value: "https://resultsmatrix.com"
